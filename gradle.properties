# Give the Gradle daemon enough heap for Paper builds.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m
# 环境修复（D 验证阶段）：宿主 JAVA_HOME 指向 JDK 26，Gradle 8.14.3 的嵌入式 Kotlin
# 无法解析 Java 26 版本号（IllegalArgumentException: 26）。将 daemon 固定到 JDK 21；
# 编译 toolchain 仍为 JDK 25（本地 C:\Program Files\Java\jdk-25 自动探测）。
org.gradle.java.home=C:/Program Files/Java/jdk-21
